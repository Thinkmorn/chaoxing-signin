services:
  chaoxing-signin:
    build:
      context: .
      dockerfile: Dockerfile
    image: chaoxing-signin:V1
    container_name: chaoxing-signin
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Required: account configuration
      - ./env.json:/app/env.json:ro
      # Recommended: persistent storage (login tokens, sign-in cache)
      - ./data/storage.json:/app/configs/storage.json
      # Recommended: NapCat QQ login state persistence (.sig files)
      - ./data/napcat:/app/napcat/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
